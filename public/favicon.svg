<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Orbit Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Orbital Node Satellites -->
  <circle cx="64" cy="22" r="5" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="64" cy="106" r="5" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="22" cy="64" r="5" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="106" cy="64" r="5" fill="#00D2FF" filter="url(#glow)"/>

  <!-- Core Reactor -->
  <circle cx="64" cy="64" r="14" fill="#080A0F" stroke="#00D2FF" stroke-width="3"/>
  <circle cx="64" cy="64" r="7" fill="#00D2FF" filter="url(#glow)"/>

  <!-- Tech Crosshairs -->
  <line x1="64" y1="36" x2="64" y2="44" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="84" x2="64" y2="92" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="64" x2="44" y2="64" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="64" x2="92" y2="64" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
</svg>